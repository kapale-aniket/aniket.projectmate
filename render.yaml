# Render.com blueprint for Aniket.ProjectMate
services:
  - type: web
    name: projectmate-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: projectmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: projectmate-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: projectmate-redis
          type: redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"

  - type: worker
    name: projectmate-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        fromService:
          name: projectmate-web
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: projectmate-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: projectmate-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: projectmate-redis
          type: redis
          property: connectionString

  - type: redis
    name: projectmate-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: projectmate-db
    plan: free
