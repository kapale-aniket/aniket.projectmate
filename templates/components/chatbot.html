{% load static %}
{# Global ProjectMateBot — ProjectMate knowledge-base helper #}
<div id="pmChatbot"
     class="pm-chatbot"
     hx-boost="false"
     data-ask-url="{% url 'core:chatbot_ask' %}"
     data-site-name="{{ SITE_NAME|default:'Aniket.ProjectMate' }}"
     data-email="{{ site_settings.contact_email|default:'' }}"
     data-phone="{{ site_settings.contact_phone|default:'' }}"
     data-whatsapp="{% if site_settings.show_whatsapp_icon and site_settings.whatsapp_url %}1{% endif %}">
  <div id="pmChatPanel" class="pm-chat__panel" role="dialog" aria-label="ProjectMateBot help chat" aria-hidden="true">
    <header class="pm-chat__header">
      <div class="pm-chat__avatar" aria-hidden="true">
        <svg class="pm-chat__avatar-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" fill="url(#pmAvGrad)"/>
          <path d="M14 28c0-6.6 4.5-12 10-12s10 5.4 10 12v2.5c0 1.4-1.1 2.5-2.5 2.5H16.5C15.1 33 14 31.9 14 30.5V28z" fill="#fff" opacity=".95"/>
          <circle cx="19.5" cy="25" r="2.2" fill="#1a365d"/>
          <circle cx="28.5" cy="25" r="2.2" fill="#1a365d"/>
          <path d="M20 29.5c1.2 1.3 2.5 2 4 2s2.8-.7 4-2" stroke="#c4a35a" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="24" cy="12" r="3" fill="#c4a35a"/>
          <path d="M24 9V6.5" stroke="#c4a35a" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="pmAvGrad" x1="8" y1="6" x2="40" y2="42" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1a365d"/>
              <stop offset="1" stop-color="#0b1929"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="pm-chat__head-text">
        <h2 class="pm-chat__title">ProjectMateBot</h2>
        <p class="pm-chat__status"><span class="pm-chat__status-dot" aria-hidden="true"></span> <span id="pmChatStatusLabel">Any doubts? I will guide you</span></p>
      </div>
      <button type="button" class="pm-chat__close" id="pmChatClose" aria-label="Close chat">
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="pm-chat__topics-wrap is-at-start" id="pmChatTopicsWrap">
      <button type="button" class="pm-chat__topics-nav pm-chat__topics-nav--prev" id="pmChatTopicsPrev" aria-label="Previous topics" hidden>
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
        <span class="pm-chat__topics-nav-hint">Back</span>
      </button>
      <div class="pm-chat__topics" id="pmChatTopics" aria-label="Help topics"></div>
      <button type="button" class="pm-chat__topics-nav pm-chat__topics-nav--next" id="pmChatTopicsNext" aria-label="More topics">
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
        <span class="pm-chat__topics-nav-hint">Next</span>
      </button>
    </div>
    <div class="pm-chat__messages" id="pmChatMessages" aria-live="polite">
      <div class="pm-chat__typing" id="pmChatTyping" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="pm-chat__chips" id="pmChatChips" aria-label="Suggested questions"></div>
    <form class="pm-chat__form" id="pmChatForm" autocomplete="off" hx-boost="false" action="javascript:void(0)">
      <label class="visually-hidden" for="pmChatInput">Ask a question</label>
      <input class="pm-chat__input"
             id="pmChatInput"
             type="text"
             name="pm_chat_q"
             maxlength="2000"
             placeholder="Ask about ProjectMate features…"
             enterkeyhint="send"
             autocomplete="off">
      <button class="pm-chat__send" type="button" id="pmChatSend" aria-label="Send message">
        <i class="fas fa-paper-plane" aria-hidden="true"></i>
      </button>
    </form>
  </div>

  <button type="button"
          class="pm-chat__launcher"
          id="pmChatLauncher"
          aria-expanded="false"
          aria-controls="pmChatPanel"
          aria-label="Open ProjectMateBot"
          title="Chat with ProjectMateBot">
    <span class="pm-chat__launcher-ring" aria-hidden="true"></span>
    <span class="pm-chat__launcher-glow" aria-hidden="true"></span>
    <svg class="pm-chat__launcher-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="pmLaunchFace" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e8eef6"/>
        </linearGradient>
        <linearGradient id="pmLaunchGold" x1="28" y1="6" x2="40" y2="22" gradientUnits="userSpaceOnUse">
          <stop stop-color="#f0d78c"/>
          <stop offset="1" stop-color="#c4a35a"/>
        </linearGradient>
      </defs>
      <!-- chat bubble -->
      <path d="M18 22c0-6.075 5.373-11 12-11h4c6.627 0 12 4.925 12 11v6c0 6.075-5.373 11-12 11h-3.2L24 46.5 26.8 39H30c-6.627 0-12-4.925-12-11v-6z"
            fill="url(#pmLaunchFace)" opacity=".98"/>
      <!-- friendly eyes -->
      <circle cx="28" cy="27" r="2.4" fill="#1a365d"/>
      <circle cx="38" cy="27" r="2.4" fill="#1a365d"/>
      <circle cx="28.7" cy="26.3" r="0.7" fill="#fff"/>
      <circle cx="38.7" cy="26.3" r="0.7" fill="#fff"/>
      <!-- smile -->
      <path d="M29 32.2c1.4 1.6 3 2.4 5 2.4s3.6-.8 5-2.4" stroke="#c4a35a" stroke-width="2.2" stroke-linecap="round"/>
      <!-- antenna -->
      <circle cx="34" cy="9.5" r="3.2" fill="url(#pmLaunchGold)"/>
      <path d="M34 12.5V15" stroke="#c4a35a" stroke-width="2" stroke-linecap="round"/>
      <!-- sparkles -->
      <path class="pm-chat__spark" d="M48 16l1.2 2.6L52 20l-2.8 1.4L48 24l-1.2-2.6L44 20l2.8-1.4L48 16z" fill="#f0d78c"/>
      <path class="pm-chat__spark pm-chat__spark--delay" d="M16 34l.9 1.9L19 37l-2.1 1L16 40l-.9-2-2.1-1 2.1-1.1L16 34z" fill="#f0d78c"/>
    </svg>
    <span class="pm-chat__launcher-badge" aria-hidden="true">PM</span>
  </button>
</div>
