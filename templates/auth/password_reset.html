{% extends "base/base.html" %}
{% block title %}Reset password — Aniket.ProjectMate{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="container">
    <div class="glass-card auth-card no-hover">
      <h1 class="h3 display-font mb-3">Forgot password?</h1>
      <p class="text-muted">Enter your email and we'll send reset instructions.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-pm w-100">Send reset link</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
