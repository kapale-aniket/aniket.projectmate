<section class="li-settings-section mb-3">
  <h3 class="h6 mb-1">WhatsApp &amp; Instagram (Excel sheet)</h3>
  <p class="small text-muted mb-3">Shown as clickable links on row 2 of every job output file.</p>
  <div class="row g-2">
    <div class="col-md-6">
      <label class="form-label">WhatsApp group name</label>
      {{ settings_form.whatsapp_group_name }}
    </div>
    <div class="col-md-6">
      <label class="form-label">WhatsApp group URL</label>
      {{ settings_form.whatsapp_group_url }}
    </div>
    <div class="col-md-6">
      <label class="form-label">Instagram handle</label>
      {{ settings_form.instagram_handle }}
    </div>
    <div class="col-md-6">
      <label class="form-label">Instagram URL</label>
      {{ settings_form.instagram_url }}
    </div>
  </div>
</section>
