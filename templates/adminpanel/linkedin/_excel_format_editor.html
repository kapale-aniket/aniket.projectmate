{% comment %}Excel format editor — Bootstrap{% endcomment %}
<section class="li-settings-section" data-excel-format-section="{{ scraper_type }}">
  <h3 class="h6 mb-1">Excel &amp; output format</h3>
  <p class="small text-muted mb-3">Sheet title, columns, colours for {{ scraper_label }}.</p>
  <div class="pm-excel-format-editor" data-scraper-type="{{ scraper_type }}">
    <div class="row g-2">
      <div class="col-md-6">
        <label class="form-label">Sheet title</label>
        <input type="text" class="form-control form-control-sm" data-excel-field="sheet_title" maxlength="120">
      </div>
      <div class="col-md-6">
        <label class="form-label">Sheet tab name</label>
        <input type="text" class="form-control form-control-sm" data-excel-field="sheet_name" maxlength="31">
      </div>
      <div class="col-md-6">
        <label class="form-label">Watermark</label>
        <input type="text" class="form-control form-control-sm" data-excel-field="watermark_text" maxlength="60">
      </div>
      <div class="col-md-6">
        <label class="form-label">Header background</label>
        <input type="text" class="form-control form-control-sm" data-excel-style="header_bg" maxlength="7" placeholder="#1F4E79">
      </div>
      <div class="col-md-6">
        <label class="form-label">Header text colour</label>
        <input type="text" class="form-control form-control-sm" data-excel-style="header_font_color" maxlength="7" placeholder="#FFFFFF">
      </div>
      <div class="col-md-6">
        <label class="form-label">Title colour</label>
        <input type="text" class="form-control form-control-sm" data-excel-style="title_color" maxlength="7" placeholder="#1F4E79">
      </div>
      <div class="col-md-6">
        <label class="form-label">Alternate row</label>
        <input type="text" class="form-control form-control-sm" data-excel-style="alternate_row_bg" maxlength="7" placeholder="#F2F7FB">
      </div>
      <div class="col-md-6">
        <label class="form-label">Link colour</label>
        <input type="text" class="form-control form-control-sm" data-excel-style="link_color" maxlength="7" placeholder="#0563C1">
      </div>
    </div>

    {% if scraper_type == 'job' %}
    <div class="row g-2 mt-2">
      <div class="col-md-6">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" data-excel-layout="group_by_experience" checked id="excel_gbe_{{ scraper_type }}">
          <label class="form-check-label" for="excel_gbe_{{ scraper_type }}">Group by experience</label>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" data-excel-layout="group_by_company_size" checked id="excel_gbc_{{ scraper_type }}">
          <label class="form-check-label" for="excel_gbc_{{ scraper_type }}">Group by company size</label>
        </div>
      </div>
      <div class="col-md-6">
        <label class="form-label">0-year section label</label>
        <input type="text" class="form-control form-control-sm" data-excel-layout-text="zero_year_section" maxlength="80">
      </div>
      <div class="col-md-6">
        <label class="form-label">1-year section label</label>
        <input type="text" class="form-control form-control-sm" data-excel-layout-text="one_year_section" maxlength="80">
      </div>
    </div>
    {% elif scraper_type == 'connection' %}
    <div class="form-check mt-3">
      <input type="checkbox" class="form-check-input" data-excel-layout="export_excel" checked id="excel_export_{{ scraper_type }}">
      <label class="form-check-label" for="excel_export_{{ scraper_type }}">Also export Excel (.xlsx) after each run</label>
    </div>
    {% endif %}

    <div class="mt-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span class="form-label mb-0">Columns</span>
        <button type="button" class="btn btn-link btn-sm p-0" data-excel-reset-columns>Reset columns</button>
      </div>
      <p class="small text-muted">Reorder with arrows. Uncheck to hide.</p>
      <div class="pm-excel-columns-list" data-excel-columns-list></div>
    </div>
  </div>
</section>
