{% extends "base/base.html" %}
{% block title %}{{ error_title }} — {{ SITE_NAME|default:"Aniket.ProjectMate" }}{% endblock %}
{% block content %}
<section class="pm-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="glass-card p-4 p-md-5 text-center no-hover error-card">
          <div class="error-code mb-2">{{ status_code }}</div>
          <h1 class="h3 display-font mb-2">{{ error_title }}</h1>
          <p class="text-muted mb-3">{{ error_message }}</p>
          {% if error_hint %}
          <p class="small text-muted mb-4">{{ error_hint }}</p>
          {% endif %}
          <div class="d-flex flex-wrap gap-2 justify-content-center">
            <button type="button" class="btn btn-pm" onclick="window.history.length > 1 ? history.back() : (location.href='/')">
              <i class="fas fa-arrow-left me-1"></i> Go back
            </button>
            <button type="button" class="btn btn-pm-outline" onclick="location.reload()">
              <i class="fas fa-rotate-right me-1"></i> Reload page
            </button>
            <a href="{% url 'core:home' %}" class="btn btn-outline-secondary">Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
